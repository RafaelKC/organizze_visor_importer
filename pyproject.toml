[project]
name = "visorsync"
version = "0.1.0"
description = "CLI para sincronizar dados do Organizze para o Visor via MCP"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "mcp>=1.2.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
visorsync = "visorsync.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["visorsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
