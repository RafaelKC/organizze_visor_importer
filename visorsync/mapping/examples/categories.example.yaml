# Category mapping: Organizze category name -> Visor category.
#
# Copy this file to $VISORSYNC_HOME/config/categories.yaml and adjust to
# your own category names. `is_custom: true` means the category needs to be
# created in Visor (create_category) if it doesn't exist yet by name;
# `is_custom: false` means it's assumed to already exist as a system
# category, identified by `visor_slug`.
#
# Visor's create_category tool assigns the slug itself from `name` -- you
# cannot pick it. For `is_custom` entries, `visor_slug` below is only a
# hint/expected value for your own reference; sync-structure matches
# existing custom categories by name and caches the real assigned slug in
# state.db automatically. `emoji` is required by Visor when creating a
# custom category; `category_type` ("expense"/"income") is required for a
# new top-level category (omit for a subcategory of `parent_slug`) and
# defaults to "expense" if left unset.

categories:
  - organizze_name: "Example Category"
    visor_slug: "example-slug"
    is_custom: false

  - organizze_name: "Example Custom Category"
    visor_slug: "example_custom_slug"   # hint only, see note above
    is_custom: true
    emoji: "🎉"
    category_type: "expense"           # or "income"; omit if parent_slug is set
    # parent_slug: "leisure"           # optional: create as a subcategory instead

# Visor system category slugs hidden during this migration -- never used as
# a mapping destination, and what `reset-visor` reverts (unhide_category)
# if they were hidden by this tool.
hidden_system_category_slugs:
  - "example-hidden-slug"

# Category trees you want left exactly as-is -- sync-structure/migrate will
# never touch these.
protected_category_trees:
  - "example-protected-tree"

# Known cases where a recurring pattern ended up under the wrong category
# and needs manual review/retry (see commands/sync_structure.py).
known_miscategorized_patterns:
  - pattern_name: "Example Pattern"
    current_slug: "wrong-slug"
    correct_slug: "right-slug"
